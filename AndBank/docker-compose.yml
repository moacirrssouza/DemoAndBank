version: '3.8'

services:
  postgres:
    container_name: postgres_db
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev#123456
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - andbank-net

  andbank.api:
    container_name: andbank_api
    build:
      context: .
      dockerfile: AndBank.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=dev#123456
    ports:
      - "5000:8080"
    depends_on:
      - postgres
    networks:
      - andbank-net

  andbank.consoleapp:
    container_name: andbank_consoleapp
    build:
      context: .
      dockerfile: AndBank.ConsoleApp/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=dev#123456
    depends_on:
      - postgres
    networks:
      - andbank-net

networks:
  andbank-net:
    driver: bridge
